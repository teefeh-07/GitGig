[project]
name = "GitGig"
authors = ["teefeh-07"]
description = "A decentralized freelance platform on Stacks blockchain enabling secure gig management, escrow payments, and reputation tracking"
telemetry = true
requirements = []
cache_dir = "/home/runner/Teefeh/GitGig/./.requirements"
boot_contracts = ["pox", "costs-v2", "bns"]
[contracts.teefeh]
path = "contracts/teefeh.clar"

[repl]
costs_version = 2
parser_version = 2

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
